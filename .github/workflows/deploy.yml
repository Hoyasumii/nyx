name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Set under Settings → Secrets and variables → Actions → Variables.
          VITE_ADS_PROVIDER: ${{ vars.VITE_ADS_PROVIDER }}
          VITE_ETHICALADS_PUBLISHER: ${{ vars.VITE_ETHICALADS_PUBLISHER }}
          VITE_CARBON_SERVE: ${{ vars.VITE_CARBON_SERVE }}
          VITE_CARBON_PLACEMENT: ${{ vars.VITE_CARBON_PLACEMENT }}
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
